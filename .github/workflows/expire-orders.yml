name: Expire Stale Orders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Call expire-orders endpoint
        run: |
          curl -fsS -X GET "https://alzaintea.com/api/cron/expire-orders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"